<!doctype html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <title>TechConf</title>
  </head>
  <body>
    <header class="sticky-top">
      <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container">
          <a class="navbar-brand" href="#">TechConf</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link" aria-current="page" href="#">Inicio</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Speakers</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Preguntas frecuentes</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Registro</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>
    <main>
        <!-- hero section -->
         <section>
            <h1>Congreso de Tecnología 2026</h1>
            <p>Aprendé sobre React, Next.js y el futuro de la IA</p>
           <button>Quiero inscribirme</button>
         </section>
        <!-- seccion formulario de registro -->
      <section id="registroForm" class="py-5">
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-md-6 text-center">
              <h2>Registrarse al Evento</h2>
              <form class="mt-4">
                <div class="mb-3">
                  <input
                    type="text"
                    class="form-control"
                    placeholder="Nombre Completo"
                  />
                </div>
                <div class="mb-3">
                  <input
                    type="email"
                    class="form-control"
                    placeholder="Tu Email"
                  />
                </div>
                <butto type="submit" class="btn btn-success w-100"
                  >Enviar Registro</butto
                >
              </form>
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer class="text-center py-5 bg-black">
      <p>
        &copy; 2026 TechConf - Tucumán, Argentina. Todos los derechos
        reservados.
      </p>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
